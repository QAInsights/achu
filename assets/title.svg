<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 100" width="600" height="100">
  <style>
    @keyframes gradient-shift {
      0% {
        stop-color: #CCFF00;
      }
      50% {
        stop-color: #A9E932;
      }
      100% {
        stop-color: #00FFCC;
      }
    }
    @keyframes gradient-shift-2 {
      0% {
        stop-color: #00FFCC;
      }
      50% {
        stop-color: #D4FF00;
      }
      100% {
        stop-color: #CCFF00;
      }
    }
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 76px;
      text-anchor: middle;
      fill: url(#animated-gradient);
      letter-spacing: -0.03em;
    }
    .stop-left {
      animation: gradient-shift 8s ease infinite alternate;
    }
    .stop-right {
      animation: gradient-shift-2 8s ease infinite alternate;
    }
  </style>
  <defs>
    <linearGradient id="animated-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" class="stop-left" />
      <stop offset="100%" class="stop-right" />
    </linearGradient>
  </defs>
  <text x="300" y="80" class="title-text">Achu</text>
</svg>
