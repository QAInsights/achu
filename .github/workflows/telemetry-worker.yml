name: Telemetry worker

on:
  pull_request:
    paths:
      - 'telemetry-worker/**'
      - '.github/workflows/telemetry-worker.yml'
  push:
    branches:
      - main
    paths:
      - 'telemetry-worker/**'
      - '.github/workflows/telemetry-worker.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telemetry-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: telemetry-worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run deploy:dry
